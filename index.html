<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Recueil Irlandais</title>
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Recueil Irlandais">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">

  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent: #2e7d32;
      --accent-light: #4caf50;
      --text: #ffffff;
      --text-muted: #aaaaaa;
      --border: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-right: env(safe-area-inset-right);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
    }

    #display-section {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      border-bottom: 1px solid var(--border);
      background: #0a0a0a;
      text-align: center;
    }

    #sheet-container {
      width: 100%;
    }

    .suite-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--accent-light);
      margin-bottom: 4px;
    }

    .suite-tunes {
      font-size: 1rem;
      font-style: italic;
      margin-bottom: 10px;
      color: var(--text);
    }

    .partition-img {
      display: block;
      max-width: 100%;
      max-height: 65vh;
      margin: 0 auto;
      object-fit: contain;
      border-radius: 4px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }

    .image-error {
      margin-top: 12px;
      color: #ffb4ab;
      font-size: 0.9rem;
    }

    .no-selection,
    .no-result {
      color: var(--text-muted);
      font-style: italic;
    }

    #filter-section {
      flex: 0 0 auto;
      background-color: var(--card-bg);
      padding: 15px;
      max-height: 50vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .field-block {
      margin-bottom: 10px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    input,
    select {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      background: var(--bg-color);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      font-size: 16px;
      outline: none;
      display: block;
      -webkit-appearance: none;
      appearance: none;
    }

    select {
      background-image:
        linear-gradient(45deg, transparent 50%, var(--text-muted) 50%),
        linear-gradient(135deg, var(--text-muted) 50%, transparent 50%);
      background-position:
        calc(100% - 18px) 50%,
        calc(100% - 12px) 50%;
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
      padding-right: 36px;
    }

    input:focus,
    select:focus {
      border-color: var(--accent-light);
    }

    .results-list {
      margin-top: 10px;
      max-height: 155px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg-color);
    }

    .result-item {
      width: 100%;
      padding: 12px;
      border: 0;
      border-bottom: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .result-item:last-child {
      border-bottom: none;
    }

    .result-item.active {
      background-color: var(--accent);
      color: #ffffff;
    }

    @media (orientation: landscape) {
      #filter-section {
        display: none;
      }

      #display-section {
        height: 100vh;
        height: 100dvh;
        border-bottom: none;
        padding: 5px;
      }

      .partition-img {
        max-height: 82vh;
      }
    }
  </style>
</head>
<body>
  <main id="display-section">
    <div id="sheet-container" class="no-selection">
      Sélectionnez une suite pour commencer.
    </div>
  </main>

  <section id="filter-section" aria-label="Filtres">
    <div class="field-block">
      <label for="search-tune">Tune...</label>
      <input type="search" id="search-tune" placeholder="Saisir les premières lettres..." autocomplete="off">
    </div>

    <div class="field-block">
      <label for="filter-num">Set#</label>
      <select id="filter-num">
        <option value="">Tous</option>
      </select>
    </div>

    <div class="field-block">
      <label for="filter-type">Set type</label>
      <select id="filter-type">
        <option value="">Tous</option>
      </select>
    </div>

    <div class="results-list" id="results-list" aria-live="polite"></div>
  </section>

      var filterNum = document.getElementById("filter-num");
      var filterType = document.getElementById("filter-type");
      var searchTune = document.getElementById("search-tune");
      var resultsList = document.getElementById("results-list");
      var sheetContainer = document.getElementById("sheet-container");
      var activeSuiteId = null;

      function normalizeText(value) {
        var text = String(value || "").toLowerCase();
        if (text.normalize) {
          text = text.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        }
        return text;
      }

      function addOption(select, value, text) {
        var option = document.createElement("option");
        option.value = value;
        option.textContent = text;
        select.appendChild(option);
      }

      function initializeFilters() {
        var typeMap = {};
        var types = [];
        var i;

        for (i = 0; i < suites.length; i++) {
          addOption(filterNum, suites[i].num, suites[i].num);
          if (!typeMap[suites[i].type]) {
            typeMap[suites[i].type] = true;
            types.push(suites[i].type);
          }
        }

        types.sort();
        for (i = 0; i < types.length; i++) {
          addOption(filterType, types[i], types[i]);
        }
      }

      function displaySuite(suite) {
        activeSuiteId = suite.id;
        sheetContainer.className = "";
        sheetContainer.textContent = "";

        var title = document.createElement("div");
        title.className = "suite-title";
        title.textContent = suite.id + " (" + suite.type + ")";

        var tunes = document.createElement("div");
        tunes.className = "suite-tunes";
        tunes.textContent = suite.tunes.join(" → ");

        var image = document.createElement("img");
        image.className = "partition-img";
        image.src = embeddedImages[suite.num] || "";
        image.alt = "Partition de la suite " + suite.num;
        image.loading = "eager";

        image.addEventListener("error", function () {
          image.style.display = "none";
          var error = document.createElement("div");
          error.className = "image-error";
          error.textContent = "Image non intégrée pour la suite " + suite.num + ". Cette version contient les suites 01 à 10.";
          sheetContainer.appendChild(error);
        }, { once: true });

        sheetContainer.appendChild(title);
        sheetContainer.appendChild(tunes);
        sheetContainer.appendChild(image);

        updateActiveResult();
      }

      function updateActiveResult() {
        var items = resultsList.getElementsByClassName("result-item");
        var i;
        for (i = 0; i < items.length; i++) {
          if (items[i].getAttribute("data-id") === activeSuiteId) {
            items[i].classList.add("active");
          } else {
            items[i].classList.remove("active");
          }
        }
      }

      function createResultItem(suite) {
        var button = document.createElement("button");
        var preview = suite.tunes.slice(0, 2).join(", ");

        if (suite.tunes.length > 2) {
          preview += "...";
        }

        button.type = "button";
        button.className = "result-item";
        button.setAttribute("data-id", suite.id);
        button.textContent = "#" + suite.num + " [" + suite.type + "] - " + preview;
        button.addEventListener("click", function () {
          displaySuite(suite);
        });

        return button;
      }

      function updateFilters() {
        var selectedNum = filterNum.value;
        var selectedType = filterType.value;
        var searchText = normalizeText(searchTune.value.trim());
        var matches = [];
        var i;
        var j;

        resultsList.textContent = "";

        for (i = 0; i < suites.length; i++) {
          var suite = suites[i];
          var matchNum = !selectedNum || suite.num === selectedNum;
          var matchType = !selectedType || suite.type === selectedType;
          var matchTune = !searchText;

          if (!matchTune) {
            for (j = 0; j < suite.tunes.length; j++) {
              if (normalizeText(suite.tunes[j]).indexOf(searchText) !== -1) {
                matchTune = true;
                break;
              }
            }
          }

          if (matchNum && matchType && matchTune) {
            matches.push(suite);
            resultsList.appendChild(createResultItem(suite));
          }
        }

        if (matches.length === 0) {
          var empty = document.createElement("div");
          empty.className = "result-item no-result";
          empty.textContent = "Aucun résultat";
          resultsList.appendChild(empty);
        }

        updateActiveResult();
      }

      filterNum.addEventListener("change", function () {
        updateFilters();
        filterNum.blur();
      });

      filterType.addEventListener("change", function () {
        updateFilters();
        filterType.blur();
      });

      searchTune.addEventListener("input", updateFilters);

      initializeFilters();
      updateFilters();
    });
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./service-worker.js");
      });
    }
  </script>
</body>
</html>
